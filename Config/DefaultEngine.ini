; XRFPS 엔진 설정
; 근거: docs/decisions/ADR-0003-engine-toolchain-xr.md, docs/design/01-dev-environment.md
; 기준: UE 5.8 VR 템플릿(TP_VirtualRealityBP)의 설정을 따르되, 다른 값은 주석으로 이유를 남긴다.

[/Script/EngineSettings.GameMapsSettings]
; 엔진 기본값은 OpenWorld(월드 파티션 + 지형)라 내장 GPU에서 무거움 → 바닥·조명만 있는 엔진 기본 맵 사용
; 단계 7에서 프로젝트 전용 맵을 만들면 교체
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default

[/Script/Engine.RendererSettings]
; --- Quest(모바일) 렌더링 ---
; 5.8부터 모바일 기본 렌더러가 Deferred라서 Forward를 명시 (0=Forward, 1=Deferred)
r.Mobile.ShadingPath=0
; 3=MSAA (Forward에서만 지원), 샘플 수는 r.MSAACount
r.Mobile.AntiAliasing=3
r.MSAACount=4
; 두 눈을 한 번에 렌더링 (Vulkan 필요)
vr.MobileMultiView=True
; 모바일 포스트 프로세싱 전체 패스 끄기 → 성능 확보, 스테레오 최적화 허용
r.MobileHDR=False
r.Mobile.UseHWsRGBEncoding=True
r.Mobile.PropagateAlpha=True
r.Mobile.AllowFramebufferFetch=1

; --- 데스크톱(Win64 서버 겸 플레이어, 에디터) 렌더링 ---
; Quest와 같은 Forward + MSAA로 맞추고, 내장 GPU에서 가볍게 유지
r.ForwardShading=True
r.AntiAliasingMethod=3
vr.InstancedStereo=True
; Lumen, Nanite, 가상 섀도 맵, 하드웨어 레이트레이싱 사용 안 함 (Quest 미지원 + 내장 GPU)
r.DynamicGlobalIlluminationMethod=0
; 0=None. VR 템플릿은 1(Lumen)이지만 GI를 끈 Forward 구성에서는 의미가 없어 0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.RayTracing=False
; VR 템플릿은 True. 메시 빌드 시간·용량을 줄이려고 끔 (Lumen·DFAO를 쓰지 않음)
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=True

; VR에서 어지럼증을 유발하거나 비싼 기본 후처리 끄기
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.eshoong2.xrfps
ApplicationDisplayName=XRFPS
; Meta 매니페스트 정책: 몰입형 앱 권장 min 32 / target 34 (5.8.2+ 엔진 기본 target은 36)
MinSDKVersion=32
TargetSDKVersion=34
; Quest는 arm64 + Vulkan만
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=False
; Meta 전용 매니페스트 항목 추가: com.oculus.intent.category.VR, android.hardware.vr.headtracking, focusaware
bPackageForMetaQuest=True
; VR 템플릿은 True. Khronos 표준 IMMERSIVE_HMD 인텐트와 OPENXR_SYSTEM 권한(Android XR용)을 추가할 뿐이라
; Quest 전용인 이 프로젝트에서는 끔 (엔진 OpenXR_APL.xml에서 확인)
bPackageForOpenXRImmersive=False
; supportedDevices는 엔진이 자동으로 넣지 않아 직접 지정
ExtraApplicationSettings=<meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" />

